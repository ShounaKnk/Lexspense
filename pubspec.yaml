name: lexledger
description: Privacy-first expense tracker for junior lawyers. 100% offline, no network, no telemetry.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.2
  home_widget: ^0.7.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  excel: ^4.0.6
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/templates/
